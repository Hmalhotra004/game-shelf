name: Feature Request
description: Suggest a new feature or improvement.
title: "[Feature]: "
labels: ["enhancement", "triage"]
type: "Feature"
assignees:
  - Hmalhotra004

body:
  - type: markdown
    attributes:
      value: |
        Have an idea to improve the project?
        I'd love to hear about it!

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: Describe the problem you're trying to solve.
      placeholder: I'm frustrated because...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution
      description: What would you like to see implemented?
      placeholder: I would like...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you considered other solutions?

  - type: upload
    id: screenshots
    attributes:
      label: Upload screenshots
      description: If applicable, add screenshots to help explain your problem.
    validations:
      required: false
