name: Bug Report
description: Report something that isn't working correctly.
title: "[Bug]: "
labels: ["bug", "triage"]
type: "Bug"
assignees:
  - Hmalhotra004

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug!
        Please provide as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear description of the issue.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can I reproduce this issue?
      placeholder: |
        1. Open...
        2. Click...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: upload
    id: screenshots
    attributes:
      label: Upload screenshots
      description: If applicable, add screenshots to help explain your problem.
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "e.g. 0.4.0"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        # - iOS
        # - Web
        # - Windows
        # - macOS
        # - Linux
        # - Other
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this isn't a duplicate
          required: true
        - label: I'm on the latest version
